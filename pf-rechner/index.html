<section class="page-title"><div class="eyebrow">LINEARE FUNKTION</div><h1>P+F Rechner</h1></section><section class="panel"><div class="grid2"><label><span>X1</span><input id="x1" type="number" value="0"></label><label><span>Y1</span><input id="y1" type="number" value="4"></label><label><span>X2</span><input id="x2" type="number" value="100"></label><label><span>Y2</span><input id="y2" type="number" value="20"></label></div><div class="grid2 result"><div><div class="muted">K-Faktor</div><strong id="k">–</strong></div><div><div class="muted">Nullpunkt</div><strong id="n">–</strong></div></div></section></main><footer class="footer">SK PLT Tools · Version 1.4.0 · Entwickelt von Simon Kiesler</footer></div><script src="../assets/app.js"></script><script>function calc(){let a=num(x1.value),b=num(y1.value),c=num(x2.value),d=num(y2.value);if([a,b,c,d].some(Number.isNaN)||a===c){k.textContent=n.textContent='Ungültig';return}let m=(d-b)/(c-a);k.textContent=de(m,6);n.textContent=de(b-m*a,6)}document.querySelectorAll('input').forEach(e=>e.oninput=calc);calc()</script></body></html>
