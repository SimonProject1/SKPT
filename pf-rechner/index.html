<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071828"><link rel="icon" href="../assets/icon-192.png"><link rel="stylesheet" href="../assets/styles.css"><title>P+F Rechner · Bayer PLT Tools</title></head><body><div class="shell"><header class="topbar"><img src="../assets/bayer-logo.webp" alt="Bayer Logo"><div class="brand">Bayer PLT Tools<small>P+F RECHNER</small></div><nav><a class="back" href="../">← Startseite</a></nav></header><main><section class="page-title"><div class="eyebrow">Zweipunkt-Kalibrierung</div><h1>P+F Rechner</h1><p>K-Faktor und Nullpunkt einer linearen Funktion berechnen.</p></section><section class="panel"><p class="info">Grundlage: <b>Y = K × X + Nullpunkt</b>. Gib zwei bekannte Wertepaare ein.</p><div class="grid two"><label><span>X₁ · Eingangswert 1</span><input id="x1" type="number" step="any" value="0"></label><label><span>Y₁ · Ausgangswert 1</span><input id="y1" type="number" step="any" value="4"></label><label><span>X₂ · Eingangswert 2</span><input id="x2" type="number" step="any" value="10"></label><label><span>Y₂ · Ausgangswert 2</span><input id="y2" type="number" step="any" value="20"></label></div><p class="warning" id="warning"></p></section><section class="grid two"><div class="result"><div><div class="label">K-Faktor</div><strong id="k">1,600000</strong></div></div><div class="result"><div><div class="label">Nullpunkt</div><strong id="zero">4,000000</strong></div></div></section><section class="panel" style="margin-top:20px"><div class="eyebrow">Rechenweg</div><p class="formula" id="fk"></p><p class="formula" id="fz"></p><div class="divider"></div><div class="grid two"><label><span>Optionaler X-Wert zur Prüfung</span><input id="testx" type="number" value="6" step="any"></label><div class="result"><div><div class="label">Berechneter Y-Wert</div><strong id="testy">13,600000</strong></div></div></div></section></main><footer class="footer">Bayer PLT Tools</footer></div><script>const $=x=>document.getElementById(x),n=x=>parseFloat($(x).value),f=x=>new Intl.NumberFormat('de-DE',{minimumFractionDigits:6,maximumFractionDigits:6}).format(x);function calc(){const x1=n('x1'),y1=n('y1'),x2=n('x2'),y2=n('y2'),tx=n('testx');$('warning').textContent='';if([x1,y1,x2,y2].some(v=>!Number.isFinite(v))||x1===x2){$('k').textContent=$('zero').textContent='–';$('warning').textContent='X₁ und X₂ müssen gültig und unterschiedlich sein.';return}const k=(y2-y1)/(x2-x1),z=y1-k*x1;$('k').textContent=f(k);$('zero').textContent=f(z);$('fk').textContent=`K = (Y₂ − Y₁) / (X₂ − X₁) = (${y2} − ${y1}) / (${x2} − ${x1}) = ${f(k)}`;$('fz').textContent=`Nullpunkt = Y₁ − K × X₁ = ${y1} − ${f(k)} × ${x1} = ${f(z)}`;$('testy').textContent=Number.isFinite(tx)?f(k*tx+z):'–'}['x1','y1','x2','y2','testx'].forEach(i=>$(i).addEventListener('input',calc));calc();</script></body></html>
