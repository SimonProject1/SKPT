<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SK PLT Tools"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="icon" href="../assets/favicon.png"><link rel="stylesheet" href="../assets/styles.css"><title>Messstellen-Dokumentation · SK PLT Tools</title></head><body><div class="shell"><header class="topbar"><img class="logo" src="../assets/logo.png" alt="SK PLT Tools Logo"><div class="brand">SK PLT Tools<small>PROCESS CONTROL TOOLBOX</small></div><div class="version">Version 1.4.0</div><a class="home" href="../">← Startseite</a></header><main>
<section class="page-title"><div class="eyebrow">DOKUMENTATION</div><h1>Messstellen-Dokumentation</h1></section><section class="panel"><div class="grid2"><label><span>Messstelle</span><input id="tag"></label><label><span>Bearbeiter</span><input id="person" value="Simon Kiesler"></label><label><span>Datum</span><input id="date" type="date"></label><label><span>Bemerkung</span><textarea id="note"></textarea></label></div><h2>Typenschild</h2><div class="checkrow"><input id="tnone" type="checkbox"><label for="tnone">Foto wird nicht benötigt</label></div><input id="tphoto" type="file" accept="image/*" multiple><div id="tlist"></div><h2>Einbausituation</h2><div class="checkrow"><input id="enone" type="checkbox"><label for="enone">Foto wird nicht benötigt</label></div><input id="ephoto" type="file" accept="image/*" multiple><div id="elist"></div><div class="toolbar"><button onclick="window.print()">Als PDF drucken</button><button onclick="resetDoc()">Neue Messstelle</button></div><p class="muted">Beim Drucken werden Kategorien ohne benötigtes Foto nicht als Fotoseiten ausgegeben.</p></section></main><footer class="footer">SK PLT Tools · Version 1.4.0 · Entwickelt von Simon Kiesler</footer></div><script src="../assets/app.js"></script><script>date.valueAsDate=new Date();const S={t:[],e:[]};function load(k,files){for(const f of files){const r=new FileReader;r.onload=()=>{S[k].push({src:r.result,note:''});draw(k)};r.readAsDataURL(f)}}function draw(k){$(k+'list').innerHTML=S[k].map((p,i)=>`<div class="photo"><img src="${p.src}"><input placeholder="Bildbeschriftung" value="${p.note}" oninput="S.${k}[${i}].note=this.value"><button onclick="S.${k}.splice(${i},1);draw('${k}')">Löschen</button></div>`).join('')}tphoto.onchange=e=>load('t',e.target.files);ephoto.onchange=e=>load('e',e.target.files);tnone.onchange=()=>{tphoto.disabled=tnone.checked;tlist.classList.toggle('hidden',tnone.checked)};enone.onchange=()=>{ephoto.disabled=enone.checked;elist.classList.toggle('hidden',enone.checked)};function resetDoc(){tag.value=note.value='';S.t=[];S.e=[];tnone.checked=enone.checked=false;draw('t');draw('e')} </script><style>@media print{.topbar,.footer,.support,.toolbar,input[type=file],.checkrow{display:none!important}.shell{width:100%;max-width:none}.photo{break-before:page;border:0}.photo img{max-height:75vh}body{background:#fff;color:#000}.panel{border:0;background:#fff}.hidden{display:none!important}}</style></body></html>
