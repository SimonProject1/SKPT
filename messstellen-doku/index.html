<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="../assets/stabilisierung.css"><title>Messstellen-Dokumentation · Bayer PLT Tools</title><style>
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{border:1px dashed #477087;border-radius:18px;background:#071a2a;overflow:hidden}.box-head,.box-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--line)}.box-foot{border-top:1px solid var(--line);border-bottom:0}.upload{position:relative;display:grid;place-items:center;min-height:125px;color:var(--muted);text-align:center}.upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.items{display:grid;gap:11px;padding:12px}.photo-item{display:grid;grid-template-columns:115px 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#061827}.photo-item img{width:115px;height:100px;object-fit:cover;border-radius:10px}.caption{width:100%;margin-bottom:8px}.actions{display:flex;gap:7px}.actions button,.secondary{min-width:42px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:#0a2133;color:var(--text);font-weight:800}.required{color:var(--danger)}textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:13px;background:#061827;color:var(--text);padding:13px;font:inherit}.export,.new-doc{width:100%;padding:15px;border:0;border-radius:14px;font:inherit;font-weight:900}.export{background:linear-gradient(135deg,var(--green),var(--cyan));color:#06141d}.export:disabled{opacity:.38}.new-doc{display:none;margin-top:10px;background:#0a2133;color:var(--text);border:1px solid var(--line)}.status{color:var(--muted);font-size:13px;margin:12px 0}.error{color:var(--danger);min-height:22px}.notneeded{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.notneeded input{width:20px;height:20px}/* iOS-Safari: Grid-Kinder und Datumsfeld duerfen die Karte nicht verbreitern */
.grid>*{min-width:0}.grid label{min-width:0}.grid input,.grid textarea{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box}input[type="date"]{-webkit-appearance:none;appearance:none;inline-size:100%;max-inline-size:100%;min-inline-size:0;text-align:center;padding-left:14px;padding-right:14px}
@media(max-width:760px){.grid,.photos{grid-template-columns:minmax(0,1fr)}.panel{min-width:0;overflow:hidden}.photo-item{grid-template-columns:90px minmax(0,1fr)}.photo-item img{width:90px;height:90px}input[type="date"]{font-size:16px;height:54px}}
</style></head><body><div class="shell"><header class="topbar"><img src="../assets/bayer-logo-web.webp" alt="Bayer Logo"><div class="brand">Bayer PLT Tools<small>MESSSTELLEN-DOKUMENTATION</small></div><nav><a class="back stb-home-link" href="../">← Startseite</a></nav></header><main><section class="page-title"><div class="eyebrow">Dokumentation</div><h1>Messstelle erfassen</h1><p>Fotos beschriften, sortieren und als PDF speichern.</p></section><section class="panel"><div class="grid"><label><span>Messstellenbezeichnung <b class="required">*</b></span><input id="tag" maxlength="120" placeholder="WUPWPxx-Vxxx-CAxxx-RAxxx-Lxxxx"></label><label><span>Datum <b class="required">*</b></span><input id="date" type="date"></label><label><span>Bearbeiter <b class="required">*</b></span><input id="worker" maxlength="100"></label></div><div class="divider"></div><label><span>Bemerkung</span><textarea id="remark"></textarea></label></section><section class="photos"><article class="box"><div class="box-head"><b>Typenschild</b><span id="plateCount">0 Fotos</span></div><div class="upload">＋ Fotos aufnehmen oder auswählen<input id="plateInput" type="file" accept="image/*" capture="environment" multiple></div><div class="items" id="plateItems"></div><div class="box-foot"><label class="notneeded"><input id="plateNone" type="checkbox">Foto wird nicht benötigt</label></div></article><article class="box"><div class="box-head"><b>Einbausituation</b><span id="installCount">0 Fotos</span></div><div class="upload">＋ Fotos aufnehmen oder auswählen<input id="installInput" type="file" accept="image/*" capture="environment" multiple></div><div class="items" id="installItems"></div><div class="box-foot"><label class="notneeded"><input id="installNone" type="checkbox">Foto wird nicht benötigt</label></div></article></section><section class="panel"><p class="status" id="status"></p><p class="error" id="error"></p><button class="export" id="export" disabled>PDF erzeugen und speichern</button><button class="new-doc" id="newDoc">Neue Messstelle erfassen</button></section></main><footer class="footer stb-footer">Bayer PLT Tools · Entwickelt von Simon Kiesler</footer></div><script>
const $=id=>document.getElementById(id),P={plate:[],install:[]};$('date').value=new Date().toISOString().slice(0,10);$('worker').value=localStorage.getItem('dokuWorker')||'Max Mustermann';
function compress(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=1800,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function add(key,files){for(const f of files)if(f.type.startsWith('image/'))P[key].push({src:await compress(f),caption:''});render(key);validate()}
function move(key,i,d){const j=i+d;if(j<0||j>=P[key].length)return;[P[key][i],P[key][j]]=[P[key][j],P[key][i]];render(key)}
function render(key){const box=$(key+'Items');box.innerHTML='';P[key].forEach((p,i)=>{const el=document.createElement('div');el.className='photo-item';el.innerHTML=`<img src="${p.src}" alt="Foto ${i+1}"><div><input class="caption" maxlength="120" placeholder="Optionale Bildbeschriftung" value="${p.caption.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><div class="actions"><button type="button" title="Nach vorne">←</button><button type="button" title="Nach hinten">→</button><button type="button" title="Löschen">×</button></div></div>`;const input=el.querySelector('input');input.oninput=()=>p.caption=input.value;const b=el.querySelectorAll('button');b[0].onclick=()=>move(key,i,-1);b[1].onclick=()=>move(key,i,1);b[2].onclick=()=>{P[key].splice(i,1);render(key);validate()};box.appendChild(el)});$(key+'Count').textContent=P[key].length+' Foto'+(P[key].length===1?'':'s')}
['plate','install'].forEach(key=>{$(key+'Input').onchange=e=>{add(key,[...e.target.files]);e.target.value=''};$(key+'None').onchange=()=>{if($(key+'None').checked&&P[key].length){if(!confirm('Vorhandene Fotos entfernen?')){$(key+'None').checked=false;return}P[key]=[];render(key)}validate()}});
function validate(){const ok=$('tag').value.trim()&&$('worker').value.trim()&&$('date').value&&(P.plate.length||$('plateNone').checked)&&(P.install.length||$('installNone').checked);$('export').disabled=!ok;$('status').textContent=ok?'Dokumentation vollständig. PDF kann erzeugt werden.':'Bitte Pflichtfelder und beide Fotobereiche vervollständigen.'}$('tag').oninput=()=>{$('tag').value=$('tag').value.toUpperCase();validate()};$('worker').oninput=()=>{localStorage.setItem('dokuWorker',$('worker').value);validate()};$('date').oninput=validate;
const enc=s=>new TextEncoder().encode(s);function cat(a){const n=a.reduce((x,y)=>x+y.length,0),o=new Uint8Array(n);let p=0;for(const x of a){o.set(x,p);p+=x.length}return o}function b64(u){const s=atob(u.split(',')[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}function esc(s){return String(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[\\()]/g,m=>'\\'+m).replace(/[^\x20-\x7e]/g,'?')}function size(u){return new Promise(ok=>{const i=new Image();i.onload=()=>ok([i.width,i.height]);i.src=u})}async function logo(){return new Promise(ok=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=360;const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,360,360);x.drawImage(i,18,18,324,324);ok(c.toDataURL('image/jpeg',.95))};i.src='../assets/bayer-logo.webp'})}
async function pdf(){try{const tag=$('tag').value.trim(),worker=$('worker').value.trim(),date=$('date').value.split('-').reverse().join('.'),entries=[];for(const [key,title] of [['plate','Typenschild'],['install','Einbausituation']]){if($(key+'None').checked)entries.push({title,note:'Foto nicht benoetigt.'});else P[key].forEach((p,i)=>entries.push({title:`${title} - Foto ${i+1} von ${P[key].length}`,caption:p.caption,src:p.src}))}const lg=await logo(),imgs=entries.filter(e=>e.src),dims=await Promise.all([size(lg),...imgs.map(e=>size(e.src))]),O=[],add=x=>(O.push(x),O.length);add(null);add(null);const f=add(enc('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>')),fb=add(enc('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>')),lb=b64(lg),lo=add(cat([enc(`<< /Type /XObject /Subtype /Image /Width 360 /Height 360 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${lb.length} >>\nstream\n`),lb,enc('\nendstream')])),pages=[],total=1+entries.length;function head(t,n){return`q 50 0 0 50 502 770 cm /Logo Do Q BT /F2 16 Tf 42 797 Td (${esc(t)}) Tj /F1 9 Tf 0 -20 Td (Messstelle: ${esc(tag)}) Tj 0 -13 Td (Bearbeiter: ${esc(worker)}) Tj 0 -13 Td (Datum: ${date}) Tj ET BT /F1 9 Tf 494 28 Td (Seite ${n} von ${total}) Tj ET`}function page(c,x=''){const co=add(enc(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`)),pg=add(null);pages.push(pg);O[pg-1]=enc(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${f} 0 R /F2 ${fb} 0 R >> /XObject << /Logo ${lo} 0 R ${x} >> >> /Contents ${co} 0 R >>`)}page(head('Messstellen-Dokumentation',1)+` BT /F2 14 Tf 42 690 Td (Bemerkung) Tj /F1 11 Tf 0 -24 Td (${esc($('remark').value||'Keine Bemerkung.')}) Tj ET`);let di=1;entries.forEach((e,k)=>{if(e.note){page(head(e.title,k+2)+` BT /F1 13 Tf 42 680 Td (${e.note}) Tj ET`);return}const[iw,ih]=dims[di++],d=b64(e.src),im=add(cat([enc(`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${d.length} >>\nstream\n`),d,enc('\nendstream')])),sc=Math.min(511/iw,590/ih),w=iw*sc,h=ih*sc,x=(595-w)/2,y=95+(590-h)/2;page(head(e.title,k+2)+` BT /F1 11 Tf 42 710 Td (${esc(e.caption||'')}) Tj ET q ${w} 0 0 ${h} ${x} ${y} cm /Photo Do Q`,`/Photo ${im} 0 R`)});O[0]=enc('<< /Type /Catalog /Pages 2 0 R >>');O[1]=enc(`<< /Type /Pages /Kids [${pages.map(x=>x+' 0 R').join(' ')}] /Count ${pages.length} >>`);const out=[enc('%PDF-1.4\n')],off=[0];let pos=out[0].length;O.forEach((o,i)=>{off.push(pos);const z=cat([enc(`${i+1} 0 obj\n`),o,enc('\nendobj\n')]);out.push(z);pos+=z.length});const start=pos;let xr=`xref\n0 ${O.length+1}\n0000000000 65535 f \n`;for(let i=1;i<off.length;i++)xr+=String(off[i]).padStart(10,'0')+' 00000 n \n';out.push(enc(xr+`trailer\n<< /Size ${O.length+1} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`));const u=URL.createObjectURL(new Blob([cat(out)],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=tag.replace(/[^A-Z0-9._-]/g,'_')+'.pdf';a.click();$('newDoc').style.display='block'}catch(e){console.error(e);$('error').textContent='PDF konnte nicht erstellt werden.'}}
$('export').onclick=pdf;$('newDoc').onclick=()=>{if(!confirm('Neue Messstelle erfassen? Die aktuellen Eingaben werden gelöscht.'))return;const w=$('worker').value;P.plate=[];P.install=[];$('tag').value='';$('remark').value='';$('date').value=new Date().toISOString().slice(0,10);$('plateNone').checked=$('installNone').checked=false;render('plate');render('install');$('worker').value=w;$('newDoc').style.display='none';$('error').textContent='';validate();scrollTo({top:0,behavior:'smooth'})};render('plate');render('install');validate();
</script><script src="../assets/stabilisierung.js"></script></body></html>
