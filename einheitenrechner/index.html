<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="../assets/stabilisierung.css"><title>Einheitenrechner · Bayer PLT Tools</title><style>.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.categories button{padding:12px;border:1px solid var(--line);border-radius:12px;background:#081d2e;color:var(--muted);font:inherit;font-weight:800}.categories button.active{color:#06141d;background:linear-gradient(135deg,var(--green),var(--cyan))}.converter{display:grid;grid-template-columns:1fr 58px 1fr;gap:14px;align-items:end}.swap{height:48px;border:1px solid var(--line);border-radius:13px;background:#0a2133;color:var(--text);font-size:24px}.result{padding:22px;border:1px solid var(--line);border-radius:18px;background:#071a2a;margin-top:10px}.result strong{display:block;color:var(--green);font-size:clamp(38px,8vw,62px);overflow-wrap:anywhere}.formula{margin-top:15px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#061827;color:var(--muted)}@media(max-width:700px){.categories{grid-template-columns:1fr 1fr}.converter{grid-template-columns:1fr}.swap{justify-self:center;width:58px;transform:rotate(90deg)}}</style></head><body><div class="shell"><header class="topbar"><img src="../assets/bayer-logo-web.webp" alt="Bayer Logo"><div class="brand">Bayer PLT Tools<small>EINHEITENRECHNER</small></div><nav><a class="back stb-home-link" href="../">← Startseite</a></nav></header><main><section class="page-title"><div class="eyebrow">Umrechnung V0.5.1</div><h1>Einheitenrechner</h1><p>Häufig benötigte PLT-Einheiten direkt und offline umrechnen.</p></section><section class="panel"><div class="categories" id="categories"></div><div class="converter"><div><label><span>Von</span><select id="from"></select></label><label><span>Wert</span><input id="value" type="number" inputmode="decimal" step="any" value="1"></label></div><button class="swap" id="swap">⇄</button><div><label><span>Nach</span><select id="to"></select></label><div class="result"><span>Ergebnis</span><strong><span id="result">1000</span> <small id="unit">mbar</small></strong></div></div></div><p class="formula" id="formula"></p></section></main><footer class="footer stb-footer">Bayer PLT Tools · Version 0.5.1 · Entwickelt von Simon Kiesler</footer></div><script>const $=x=>document.getElementById(x);const G={pressure:['Druck',{bar:1,mbar:.001,Pa:1e-5,kPa:.01,MPa:10},['bar','mbar']],volume:['Volumen',{ml:.001,L:1,'m³':1000},['L','m³']],temperature:['Temperatur',{'°C':0,K:0},['°C','K']],length:['Länge',{mm:.001,cm:.01,m:1},['mm','m']],voltage:['Spannung',{mV:.001,V:1},['mV','V']],current:['Strom',{'µA':.000001,mA:.001,A:1},['mA','A']]};let active='pressure';const fmt=n=>Number.isFinite(n)?new Intl.NumberFormat('de-DE',{maximumFractionDigits:9}).format(n):'–';function calc(){const v=parseFloat($('value').value),f=$('from').value,t=$('to').value,u=G[active][1];let r;if(!Number.isFinite(v)){r=NaN}else if(active==='temperature'){const c=f==='°C'?v:v-273.15;r=t==='°C'?c:c+273.15}else r=v*u[f]/u[t];$('result').textContent=fmt(r);$('unit').textContent=t;$('formula').textContent=`${fmt(v)} ${f} = ${fmt(r)} ${t}`}function units(){const g=G[active],o=Object.keys(g[1]).map(x=>`<option>${x}</option>`).join('');$('from').innerHTML=o;$('to').innerHTML=o;$('from').value=g[2][0];$('to').value=g[2][1];calc()}function cats(){$('categories').innerHTML=Object.entries(G).map(([k,v])=>`<button class="${k===active?'active':''}" data-k="${k}">${v[0]}</button>`).join('');$('categories').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.k;cats();units()})}$('value').oninput=calc;$('from').onchange=calc;$('to').onchange=calc;$('swap').onclick=()=>{const x=$('from').value;$('from').value=$('to').value;$('to').value=x;calc()};cats();units()</script><script src="../assets/stabilisierung.js"></script></body></html>
