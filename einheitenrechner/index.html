<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SK PLT Tools"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="icon" href="../assets/favicon.png"><link rel="stylesheet" href="../assets/styles.css"><title>Einheitenrechner · SK PLT Tools</title></head><body><div class="shell"><header class="topbar"><img class="logo" src="../assets/logo.png" alt="SK PLT Tools Logo"><div class="brand">SK PLT Tools<small>PROCESS CONTROL TOOLBOX</small></div><div class="version">Version 1.4.0</div><a class="home" href="../">← Startseite</a></header><main>
<section class="page-title"><div class="eyebrow">UMRECHNUNG</div><h1>Einheitenrechner</h1></section><section class="panel"><div class="grid3"><label><span>Kategorie</span><select id="cat"><option>Druck</option><option>Temperatur</option><option>Länge</option><option>Strom</option><option>Spannung</option></select></label><label><span>Von</span><select id="from"></select></label><label><span>Nach</span><select id="to"></select></label><label><span>Wert</span><input id="x" type="number" value="1"></label></div><div class="result"><strong id="out">–</strong></div></section></main><footer class="footer">SK PLT Tools · Version 1.4.0 · Entwickelt von Simon Kiesler</footer></div><script src="../assets/app.js"></script><script>const U={Druck:{bar:1,mbar:.001,Pa:.00001,kPa:.01,MPa:10},Temperatur:{'°C':'c',K:'k'},Länge:{mm:.001,cm:.01,m:1,km:1000},Strom:{'µA':.000001,mA:.001,A:1},Spannung:{mV:.001,V:1}};function set(){let o=Object.keys(U[cat.value]);from.innerHTML=to.innerHTML=o.map(x=>'<option>'+x+'</option>').join('');to.selectedIndex=Math.min(1,o.length-1);calc()}function calc(){let v=num(x.value),a=from.value,b=to.value;if(cat.value==='Temperatur'){let c=a==='K'?v-273.15:v;out.textContent=de(b==='K'?c+273.15:c,3)+' '+b}else out.textContent=de(v*U[cat.value][a]/U[cat.value][b],3)+' '+b}cat.onchange=set;document.querySelectorAll('#from,#to,#x').forEach(e=>e.oninput=calc);set()</script></body></html>
