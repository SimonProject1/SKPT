<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SK PLT Tools"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="icon" href="../assets/favicon.png"><link rel="stylesheet" href="../assets/styles.css"><title>Pt-Rechner · SK PLT Tools</title></head><body><div class="shell"><header class="topbar"><img class="logo" src="../assets/logo.png" alt="SK PLT Tools Logo"><div class="brand">SK PLT Tools<small>PROCESS CONTROL TOOLBOX</small></div><div class="version">Version 1.4.0</div><a class="home" href="../">← Startseite</a></header><main>
<section class="page-title"><div class="eyebrow">TEMPERATURSENSOREN</div><h1>Pt100 / Pt1000</h1></section><section class="panel"><div class="grid3"><label><span>Sensor</span><select id="sensor"><option value="100">Pt100</option><option value="1000">Pt1000</option></select></label><label><span>Richtung</span><select id="dir"><option value="tr">°C → Ω</option><option value="rt">Ω → °C</option></select></label><label><span>Eingabe</span><input id="x" type="number" value="0"></label></div><div class="result"><strong id="out">–</strong><p class="muted">Näherungsberechnung nach IEC-60751 im üblichen Bereich.</p></div></section></main><footer class="footer">SK PLT Tools · Version 1.4.0 · Entwickelt von Simon Kiesler</footer></div><script src="../assets/app.js"></script><script>function r(t,r0){const A=3.9083e-3,B=-5.775e-7,C=-4.183e-12;return t>=0?r0*(1+A*t+B*t*t):r0*(1+A*t+B*t*t+C*(t-100)*t*t*t)}function calc(){let v=num(x.value),r0=num(sensor.value);if(!Number.isFinite(v))return;if(dir.value==='tr')out.textContent=de(r(v,r0),3)+' Ω';else{let lo=-200,hi=850;for(let i=0;i<50;i++){let m=(lo+hi)/2;r(m,r0)<v?lo=m:hi=m}out.textContent=de((lo+hi)/2,2)+' °C'}}document.querySelectorAll('input,select').forEach(e=>e.oninput=calc);calc()</script></body></html>
