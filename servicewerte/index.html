<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/styles.css"><title>Servicewerte & Initial-PINs</title><style>.toolbar{display:grid;grid-template-columns:1fr 220px;gap:12px}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:12px;border-bottom:1px solid #2b4457;text-align:left}.tbl th{color:#8fb3c9}.footer{margin-top:20px}</style></head><body><div class='shell'><header class='topbar'><div class='brand'>Bayer PLT Tools<small>Version 0.3</small></div></header><main><section class='page-title'><h1>🔑 Servicewerte & Initial‑PINs</h1><p>Öffentlich dokumentierte Initialwerte aus Herstellerunterlagen.</p></section><section class='panel'><div class='toolbar'><input id='search' placeholder='Gerät oder Hersteller suchen'><select id='vendor'><option value=''>Alle Hersteller</option><option>Siemens</option><option>E+H</option></select></div><table class='tbl'><thead><tr><th>Hersteller</th><th>Gerät</th><th>PIN / Passwort</th><th>Verwendungszweck</th></tr></thead><tbody id='rows'></tbody></table></section></main><footer class='footer'>Bayer PLT Tools · Version 0.3 · Entwickelt von Simon Kiesler</footer></div><script>const data=[{vendor:'Siemens',device:'Sitrans P320',pin:'2457',purpose:'SIL Verriegelung'},{vendor:'E+H',device:'TMT82',pin:'7452',purpose:'SIL Verriegelung'}];const rows=document.getElementById('rows');function render(){const q=document.getElementById('search').value.toLowerCase();const v=document.getElementById('vendor').value;rows.innerHTML='';data.filter(r=>(!v||r.vendor===v)&&(`${r.vendor} ${r.device} ${r.pin} ${r.purpose}`).toLowerCase().includes(q)).forEach(r=>{rows.innerHTML+=`<tr><td>${r.vendor}</td><td>${r.device}</td><td>${r.pin}</td><td>${r.purpose}</td></tr>`})}search.oninput=render;vendor.onchange=render;render();</script></body></html>
