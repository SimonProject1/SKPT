<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071828"><link rel="icon" href="../assets/icon-192.png"><link rel="stylesheet" href="../assets/styles.css"><title>Analogsignal-Rechner · Bayer PLT Tools</title></head><body><div class="shell"><header class="topbar"><img src="../assets/bayer-logo.webp" alt="Bayer Logo"><div class="brand">Bayer PLT Tools<small>ANALOGSIGNAL-RECHNER</small></div><nav><a class="back" href="../">← Startseite</a></nav></header><main><section class="page-title"><div class="eyebrow">Lineare Skalierung</div><h1>Analogsignal-Rechner</h1><p>Prozesswert und Signal in beide Richtungen umrechnen.</p></section><div class="tabs"><button class="active" data-mode="forward">Prozesswert → Signal</button><button data-mode="reverse">Signal → Prozesswert</button></div><section class="panel"><div class="grid"><label><span>Prozesswert von</span><input id="p0" type="number" value="0" step="any"></label><label><span>Prozesswert bis</span><input id="p1" type="number" value="10" step="any"></label><label><span>Einheit</span><input id="pu" value="bar"></label></div><div class="divider"></div><div class="grid"><label><span>Signal von</span><input id="s0" type="number" value="4" step="any"></label><label><span>Signal bis</span><input id="s1" type="number" value="20" step="any"></label><label><span>Einheit</span><input id="su" value="mA"></label></div><div class="divider"></div><div class="grid two"><label><span id="inputLabel">Prozesswert</span><input id="x" type="number" value="6" step="any"></label><label><span>Vorlage</span><select id="preset"><option value="custom">Eigene Werte</option><option value="bar" selected>0–10 bar / 4–20 mA</option><option value="pct">0–100 % / 4–20 mA</option><option value="volt">0–100 % / 0–10 V</option></select></label></div><p class="warning" id="warning"></p></section><section class="result"><div><div class="label" id="outLabel">Ausgangssignal</div><strong><span id="out">13,600</span> <small id="outUnit">mA</small></strong></div><div class="formula" id="formula"></div></section></main><footer class="footer">Bayer PLT Tools</footer></div><script>const $=x=>document.getElementById(x),ids=['p0','p1','pu','s0','s1','su','x'];let mode='forward';const n=x=>parseFloat($(x).value),f=x=>new Intl.NumberFormat('de-DE',{minimumFractionDigits:3,maximumFractionDigits:3}).format(x);function calc(){let p0=n('p0'),p1=n('p1'),s0=n('s0'),s1=n('s1'),x=n('x'),pu=$('pu').value||'PE',su=$('su').value||'Signal';$('warning').textContent='';if([p0,p1,s0,s1,x].some(v=>!Number.isFinite(v))||p0===p1||s0===s1){$('out').textContent='–';$('warning').textContent='Bitte gültige, unterschiedliche Bereichsgrenzen eingeben.';return}let y,pct;if(mode==='forward'){pct=(x-p0)/(p1-p0);y=s0+pct*(s1-s0);$('outUnit').textContent=su;$('outLabel').textContent='Ausgangssignal';$('formula').textContent=`${s0} + ((${x} − ${p0}) / (${p1} − ${p0})) × (${s1} − ${s0}) = ${f(y)} ${su}`}else{pct=(x-s0)/(s1-s0);y=p0+pct*(p1-p0);$('outUnit').textContent=pu;$('outLabel').textContent='Prozesswert';$('formula').textContent=`${p0} + ((${x} − ${s0}) / (${s1} − ${s0})) × (${p1} − ${p0}) = ${f(y)} ${pu}`}$('out').textContent=f(y);if(pct<0||pct>1)$('warning').textContent='Hinweis: Der Wert liegt außerhalb des eingestellten Bereichs.'}ids.forEach(i=>$(i).addEventListener('input',calc));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('inputLabel').textContent=mode==='forward'?'Prozesswert':'Signalwert';$('x').value=mode==='forward'?6:13.6;calc()});$('preset').onchange=e=>{const a={bar:[0,10,'bar',4,20,'mA',6],pct:[0,100,'%',4,20,'mA',50],volt:[0,100,'%',0,10,'V',50]}[e.target.value];if(a){ids.forEach((id,i)=>$(id).value=a[i]);mode='forward';document.querySelectorAll('[data-mode]').forEach((b,i)=>b.classList.toggle('active',i===0));$('inputLabel').textContent='Prozesswert';calc()}};calc();</script></body></html>
