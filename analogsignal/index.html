<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SK PLT Tools"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="icon" href="../assets/favicon.png"><link rel="stylesheet" href="../assets/styles.css"><title>Analogsignal-Rechner · SK PLT Tools</title></head><body><div class="shell"><header class="topbar"><img class="logo" src="../assets/logo.png" alt="SK PLT Tools Logo"><div class="brand">SK PLT Tools<small>PROCESS CONTROL TOOLBOX</small></div><div class="version">Version 1.4.0</div><a class="home" href="../">← Startseite</a></header><main>
<section class="page-title"><div class="eyebrow">SIGNALTECHNIK</div><h1>Analogsignal-Rechner</h1></section><section class="panel"><div class="grid2"><label><span>Prozesswert min.</span><input id="p0" type="number" value="0"></label><label><span>Prozesswert max.</span><input id="p1" type="number" value="100"></label><label><span>Signal min. (mA)</span><input id="s0" type="number" value="4"></label><label><span>Signal max. (mA)</span><input id="s1" type="number" value="20"></label><label><span>Richtung</span><select id="dir"><option value="ps">Prozesswert → Signal</option><option value="sp">Signal → Prozesswert</option></select></label><label><span>Eingabewert</span><input id="x" type="number" value="50"></label></div><div class="result"><div class="muted">Ergebnis</div><strong id="out">–</strong><div id="pct"></div></div></section></main><footer class="footer">SK PLT Tools · Version 1.4.0 · Entwickelt von Simon Kiesler</footer></div><script src="../assets/app.js"></script><script>function calc(){let a=num(p0.value),b=num(p1.value),c=num(s0.value),d=num(s1.value),v=num(x.value),q;if([a,b,c,d,v].some(Number.isNaN)||a===b||c===d){out.textContent='Ungültige Eingabe';return}if(dir.value==='ps'){q=c+(v-a)/(b-a)*(d-c);out.textContent=de(q)+' mA';pct.textContent=de((v-a)/(b-a)*100,1)+' %'}else{q=a+(v-c)/(d-c)*(b-a);out.textContent=de(q)+' Prozesswert';pct.textContent=de((v-c)/(d-c)*100,1)+' %'}}document.querySelectorAll('input,select').forEach(e=>e.oninput=calc);calc()</script></body></html>
